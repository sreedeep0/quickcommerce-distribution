<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>KiranaKottu — Mobile preview</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f0f2ed;color:#284532;font-family:system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:920px;padding:23px 24px;margin:auto}h1{font-size:16px;letter-spacing:-.6px;margin:0;font-weight:750}h1 span{font-size:11px;letter-spacing:0;font-weight:400;color:#7c8b75;margin-left:10px}nav{display:flex;gap:5px}button{border:0;border-radius:7px;background:none;padding:9px 12px;color:#7b8973;cursor:pointer;font:inherit;font-size:11px}button.active{background:#fff;color:#285638;box-shadow:0 1px 4px #23372308}button:focus-visible{outline:2px solid #176348;outline-offset:3px}main{display:flex;justify-content:center;padding:4px 20px 30px}.phone{width:406px;height:calc(100dvh - 120px);max-height:880px;min-height:520px;border:8px solid #294332;border-radius:33px;background:#fff;box-shadow:0 15px 50px #233b2520;overflow:hidden;transition:width .2s}iframe{width:100%;height:100%;border:0;display:block;background:white}footer{text-align:center;font-size:10px;color:#87947e;padding:0 20px 20px}footer a{color:#617757;text-decoration:none}@media(max-width:700px){header,footer{display:none}main{padding:0}.phone{width:100%!important;height:100dvh;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header><h1>kiranakottu<span>Mobile preview</span></h1><nav aria-label="Preview screen size"><button data-width="320" aria-pressed="false">Compact</button><button data-width="390" class="active" aria-pressed="true">Phone</button><button data-width="430" aria-pressed="false">Large</button></nav></header>
  <main><div class="phone"><iframe src="index.html" title="KiranaKottu mobile storefront"></iframe></div></main>
  <footer>The same neighbourhood store, made for your phone. &nbsp; <a href="index.html" target="_blank" rel="noopener">Open full website &#8599;</a></footer>
  <script>
    document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.phone').style.width=`${Number(button.dataset.width)+16}px`;document.querySelectorAll('[data-width]').forEach(item=>{const active=item===button;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active))})}));
  </script>
</body>
</html>
